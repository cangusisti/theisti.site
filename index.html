<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ISTI</title>

<style>
body {
    margin: 0;
    padding: 0;
    background-color: #16417C;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Garamond, Georgia, serif;
}

.container {
    text-align: center;
}

.logo {
    color: white;
    font-size: clamp(56px, 18vw, 84px);
    font-weight: normal;
    letter-spacing: clamp(2px, 1vw, 4px);
    line-height: 1;
}

.last-i {
    position: relative;
    display: inline-block;
}

.sun {
    position: absolute;
    width: clamp(12px, 4vw, 18px);
    height: clamp(12px, 4vw, 18px);
    background: radial-gradient(circle, #FFD84D 0%, #FFCC33 100%);
    border-radius: 50%;
    left: 50%;
    transform: translateX(-50%);
    bottom: -10px;
    opacity: 0.02;
    animation: sunrise 6s ease-out forwards;
}

@keyframes sunrise {
    0% {
        bottom: -10px;
        opacity: 0.02;
    }
    20% {
        opacity: 0.08;
    }
    40% {
        opacity: 0.25;
    }
    60% {
        opacity: 0.55;
    }
    80% {
        opacity: 0.85;
    }
    100% {
        bottom: 0.9em;
        opacity: 1;
    }
}

.subtitle {
    margin-top: 14px;
    color: white;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.email {
    margin-top: 18px;
    font-size: clamp(14px, 4vw, 18px);
    letter-spacing: 1.5px;
}

.email a {
    color: white;
    text-decoration: none;
    transition: opacity 0.2s ease;
}

.email a:hover {
    opacity: 0.8;
}
</style>
</head>

<body>
<div class="container">

    <div class="logo">
        IST<span class="last-i">I<span class="sun"></span></span>
    </div>

    <div class="email">
        <a href="mailto:hello@theisti.com">hello@theisti.com</a>
    </div>

</div>
</body>
</html>
