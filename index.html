<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ISTI</title>

<style>

body {
    margin: 0;
    padding: 0;
    background-color: #16417C;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Garamond, Georgia, serif;
}

.container {
    text-align: center;
}

.logo {
    color: white;
    font-size: 90px;
    font-weight: normal;
    letter-spacing: 4px;
    line-height: 1;
}

.last-i {
    position: relative;
    display: inline-block;
}

.sun {
    position: absolute;
    width: 16px;
    height: 16px;
    background: #FFCC33;
    border-radius: 50%;

    left: 50%;
    transform: translateX(-50%);

    bottom: -8px;
    opacity: 0;

    animation: sunrise 5s ease-out forwards;
}

@keyframes sunrise {

    0% {
        bottom: -8px;
        opacity: 0;
    }

    30% {
        opacity: 1;
    }

    100% {
        bottom: 82px;
        opacity: 1;
    }
}

.email {
    margin-top: 40px;
    font-size: 18px;
    letter-spacing: 1.5px;
}

.email a {
    color: white;
    text-decoration: none;
}

.email a:hover {
    opacity: 0.8;
}

</style>

</head>

<body>

<div class="container">

    <div class="logo">
        IST<span class="last-i">I<span class="sun"></span></span>
    </div>

    <div class="email">
        <a href="mailto:hello@theisti.com">hello@theisti.com</a>
    </div>

</div>

</body>
</html>
